<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RiskExplain AI — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>RiskExplain AI</h1>
    <p class="subtitle">Intelligent Risk Communication Tool</p>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin or officer1" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Your password" required>

      <button type="submit" class="btn primary">Sign In</button>
    </form>

    <p class="hint">Demo: admin / admin123 &nbsp;|&nbsp; officer1 / risk2024</p>
  </div>
</body>
</html>
